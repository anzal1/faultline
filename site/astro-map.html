<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astro on faultline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #f3f4f1;
  --grid: #d9ddd7;
  --surface: #ffffff;
  --surface-2: #f8f9f7;
  --ink: #1a1e1c;
  --ink-2: #3d4440;
  --muted: #6c746f;
  --line: #d3d8d3;
  --line-strong: #aeb5b0;
  --edge: #8f9892;
  --accent: #3553d1;
  --accent-soft: #e6eafb;
  --new: #178a5a;
  --new-soft: #dff2e8;
  --fault: #d63b35;
  --fault-soft: #fbe5e3;
  --touch: #c98200;
  --touch-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(26, 30, 28, 0.06), 0 4px 14px rgba(26, 30, 28, 0.06);
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --panel-w: 384px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f1211;
    --grid: #232826;
    --surface: #171b19;
    --surface-2: #1c211f;
    --ink: #e7ebe8;
    --ink-2: #c2c9c4;
    --muted: #8d9690;
    --line: #2b312e;
    --line-strong: #414844;
    --edge: #5d6661;
    --accent: #7d93ff;
    --accent-soft: #1f2640;
    --new: #3fc98a;
    --new-soft: #12301f;
    --fault: #ff6b63;
    --fault-soft: #3a1917;
    --touch: #f0b43c;
    --touch-soft: #33280f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1211;
  --grid: #232826;
  --surface: #171b19;
  --surface-2: #1c211f;
  --ink: #e7ebe8;
  --ink-2: #c2c9c4;
  --muted: #8d9690;
  --line: #2b312e;
  --line-strong: #414844;
  --edge: #5d6661;
  --accent: #7d93ff;
  --accent-soft: #1f2640;
  --new: #3fc98a;
  --new-soft: #12301f;
  --fault: #ff6b63;
  --fault-soft: #3a1917;
  --touch: #f0b43c;
  --touch-soft: #33280f;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.fl-app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: minmax(0, 1fr) var(--panel-w);
  grid-template-areas: "top top" "map panel";
  min-height: 0;
}

/* Top bar */
.fl-top {
  grid-area: top;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  min-width: 0;
}
.fl-mark { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; font-size: 15px; white-space: nowrap; }
.fl-mark svg { display: block; }
.fl-repo { color: var(--muted); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fl-top .fl-spacer { flex: 1; }
.fl-range {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 46vw;
}
.fl-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--new); font-weight: 500; white-space: nowrap; }
.fl-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--new); animation: fl-pulse 1.8s ease-in-out infinite; }
.fl-live.is-busy { color: var(--touch); }
.fl-live.is-busy::before { background: var(--touch); }
.fl-live.is-off { color: var(--muted); }
.fl-live.is-off::before { background: var(--muted); animation: none; }
@keyframes fl-pulse { 50% { opacity: 0.35; } }

.fl-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 4px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.fl-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
.fl-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.fl-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.fl-seg button { border: 0; background: var(--surface); padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.fl-seg button + button { border-left: 1px solid var(--line); }
.fl-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

/* Map */
.fl-map {
  grid-area: map;
  position: relative;
  overflow: hidden;
  min-height: 0;
  background-color: var(--ground);
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px);
  background-size: 22px 22px;
  touch-action: none;
  cursor: grab;
}
.fl-map.is-panning { cursor: grabbing; }
.fl-map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fl-crumbs {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  display: flex; align-items: center; gap: 6px; font-size: 12.5px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; box-shadow: var(--shadow);
  max-width: calc(100% - 24px);
}
.fl-crumbs button { border: 0; background: none; padding: 0 2px; cursor: pointer; color: var(--accent); }
.fl-crumbs span { color: var(--muted); }
.fl-crumbs strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-tools { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.fl-legend {
  position: absolute; left: 12px; bottom: 12px; z-index: 2;
  display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
  font-size: 11.5px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  max-width: calc(100% - 24px);
}
.fl-legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }
.fl-legend .k-new { border-color: var(--new); }
.fl-legend .k-fault { border-color: var(--fault); }
.fl-legend .k-gone { border-color: var(--fault); border-top-style: dashed; opacity: 0.7; }
.fl-legend .k-plan { border-color: var(--accent); border-top-style: dotted; }
.fl-legend .k-load { border-color: var(--accent); }
.fl-legend .k-bar { width: 18px; border-top: 3px solid var(--accent); border-radius: 2px; }
.fl-legend .k-unloaded { width: 10px; height: 10px; border: 1.5px solid var(--line-strong); border-radius: 3px; opacity: 0.45; }
.fl-legend .k-touch { width: 10px; height: 10px; border: 2px solid var(--touch); border-radius: 3px; }

/* SVG map elements */
.n-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.n-name { fill: var(--ink); font: 600 13.5px var(--sans); letter-spacing: -0.005em; }
.n-sub { fill: var(--muted); font: 11px var(--mono); }
.n-chip { font: 600 10.5px var(--mono); }
.n-chip-bg { fill: var(--touch-soft); }
.n-chip-add { fill: var(--new); }
.n-chip-mod { fill: var(--touch); }
.n-chip-del { fill: var(--fault); }
.node { cursor: pointer; user-select: none; -webkit-user-select: none; }
.fl-map svg text { user-select: none; -webkit-user-select: none; }
.node:hover .n-box { stroke: var(--ink-2); }
.node.is-touched .n-box { stroke: var(--touch); stroke-width: 2; }
.node.is-selected .n-box { stroke: var(--accent); stroke-width: 2.5; }
.node.is-ghost .n-box { fill: transparent; stroke-dasharray: 4 4; }
.node.is-ghost .n-name { fill: var(--muted); }
.node.is-dim { opacity: 0.35; }
.node.is-neighbour .n-box { fill: var(--surface-2); }
.container-box { fill: color-mix(in srgb, var(--surface) 55%, transparent); stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.container-title { fill: var(--muted); font: 600 11px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; }
.group-box { fill: color-mix(in srgb, var(--surface-2) 70%, transparent); stroke: var(--line); stroke-width: 1; }
.group-title { fill: var(--ink-2); font: 600 11.5px var(--mono); }

/* Footprint */
.node.is-unloaded { opacity: 0.32; }
.node.is-unloaded:hover { opacity: 0.7; }
.node.is-chain .n-box { stroke: var(--accent); stroke-width: 2.5; }
.n-sub.is-load { fill: var(--accent); }
.n-bar-bg { fill: var(--line); }
.n-bar { fill: var(--accent); }
.n-bar-lazy { fill: color-mix(in srgb, var(--accent) 35%, transparent); }
.edge.is-load { stroke: var(--accent); opacity: 0.5; }
.edge.is-chain { stroke: var(--accent); opacity: 1; animation: fl-flow 1.4s linear infinite; stroke-dasharray: 10 4; }

.edge { fill: none; stroke: var(--edge); stroke-linecap: round; opacity: 0.26; transition: opacity 0.15s; }
.edge.is-type { stroke-dasharray: 1 4; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.edge.is-new { stroke: var(--new); opacity: 1; }
.edge.is-grown { stroke: var(--ink-2); opacity: 0.55; }
.edge.is-fault { stroke: var(--fault); opacity: 1; }
.edge.is-fault-old { stroke: var(--fault); opacity: 0.55; }
.edge.is-gone { stroke: var(--fault); opacity: 0.6; stroke-dasharray: 5 5; }
.edge.is-hot { opacity: 0.95; stroke: var(--ink-2); }
.edge.is-planned { stroke: var(--accent); opacity: 0.9; stroke-dasharray: 2 6; }
.edge.is-selected { stroke: var(--accent); opacity: 1; }
.edge.is-selected.is-new, .edge.is-selected.is-grown { stroke: var(--new); }
.edge.is-selected.is-fault, .edge.is-selected.is-fault-old, .edge.is-selected.is-gone { stroke: var(--fault); }
.edge.is-faded { opacity: 0.08; }
.edge.is-new.is-faded, .edge.is-fault.is-faded, .edge.is-gone.is-faded { opacity: 0.3; }
.edge.is-new, .edge.is-fault { animation: fl-flow 1.4s linear infinite; stroke-dasharray: 10 4; }
@keyframes fl-flow { to { stroke-dashoffset: -28; } }
.arrow-default { fill: var(--edge); }
.arrow-new { fill: var(--new); }
.arrow-fault { fill: var(--fault); }
.arrow-accent { fill: var(--accent); }
.arrow-hot { fill: var(--ink-2); }
@media (prefers-reduced-motion: reduce) {
  .edge.is-new, .edge.is-fault, .edge.is-chain { animation: none; }
  .fl-live::before { animation: none; }
}

/* Panel */
.fl-panel {
  grid-area: panel;
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
}
.fl-panel-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; flex: 1; }
.fl-headline { font-size: 17px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.fl-headline.is-fault { color: var(--fault); }
.fl-sub { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.fl-sub code, .fl-mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.fl-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.fl-findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fl-finding {
  display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start;
  padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  cursor: default; text-align: left; width: 100%;
}
.fl-finding[data-edge] { cursor: pointer; }
.fl-finding[data-edge]:hover { border-color: var(--line-strong); background: var(--surface-2); }
.fl-finding .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--line-strong); }
.fl-finding.sev-fault { background: var(--fault-soft); border-color: color-mix(in srgb, var(--fault) 35%, transparent); }
.fl-finding.sev-fault .dot { background: var(--fault); }
.fl-finding.sev-structure .dot { background: var(--new); }
.fl-finding .t { font-weight: 600; font-size: 13px; }
.fl-finding.sev-info .t { font-weight: 500; color: var(--ink-2); }
.fl-finding .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.fl-more { border: 1px solid var(--line); border-radius: 8px; }
.fl-more > summary { cursor: pointer; padding: 8px 10px; font-size: 12.5px; color: var(--muted); list-style: none; }
.fl-more > summary::-webkit-details-marker { display: none; }
.fl-more > summary::before { content: "▸ "; }
.fl-more[open] > summary::before { content: "▾ "; }
.fl-more .fl-findings { padding: 0 6px 6px; }
.fl-note { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.fl-note p { margin: 0; }
.fl-empty { color: var(--muted); font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: 8px; }

.fl-touched { display: flex; flex-direction: column; gap: 4px; }
.fl-trow { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.fl-trow:hover .nm { color: var(--accent); }
.fl-counts { font-family: var(--mono); font-size: 11.5px; display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.c-add { color: var(--new); }
.c-mod { color: var(--touch); }
.c-del { color: var(--fault); }

/* Timeline */
.fl-timeline { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.fl-tl-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.fl-scrub { position: relative; height: 26px; }
.fl-scrub input { width: 100%; margin: 0; position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
.fl-track { position: absolute; left: 6px; right: 6px; top: 12px; height: 2px; background: var(--line-strong); border-radius: 2px; }
.fl-tick { position: absolute; top: 7px; width: 4px; height: 12px; margin-left: -2px; border-radius: 2px; background: var(--line-strong); }
.fl-tick.k-structure { background: var(--new); height: 14px; top: 6px; }
.fl-tick.k-fault { background: var(--fault); height: 16px; top: 5px; }
.fl-thumb { position: absolute; top: 3px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow); pointer-events: none; }
.fl-steps { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.fl-step { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.fl-step:hover { background: var(--surface); }
.fl-step.is-current { background: var(--accent-soft); }
.fl-step .k { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.fl-step .k.k-structure { background: var(--new); }
.fl-step .k.k-fault { background: var(--fault); }
.fl-step .s { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fl-step .r { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

/* Evidence list */
.fl-back { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; font-size: 12.5px; align-self: flex-start; }
.fl-ev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fl-ev li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.fl-ev li.is-new { border-color: color-mix(in srgb, var(--new) 45%, transparent); background: var(--new-soft); }
.fl-ev .path { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; color: var(--ink-2); }
.fl-ev .arrow { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.fl-ev .names { margin-top: 3px; color: var(--muted); }
.fl-ev .names b { color: var(--ink); font-weight: 500; font-family: var(--mono); font-size: 11.5px; }
.fl-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.fl-kv dt { color: var(--muted); }
.fl-kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.fl-deps { display: flex; flex-wrap: wrap; gap: 6px; }
.fl-dep { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.fl-dep:hover { border-color: var(--accent); color: var(--accent); }
.fl-dep .n { font-family: var(--mono); color: var(--muted); margin-left: 4px; font-size: 11px; }
.fl-dep.is-new { border-color: var(--new); color: var(--new); }
.fl-dep.is-fault { border-color: var(--fault); color: var(--fault); }
.fl-files { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 11.5px; display: flex; flex-direction: column; gap: 3px; }
.fl-files li { overflow-wrap: anywhere; }
.fl-files .st { display: inline-block; width: 14px; font-weight: 600; }

.fl-steer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fl-input { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; flex: 1 1 140px; }
.fl-danger { color: var(--fault); border-color: color-mix(in srgb, var(--fault) 40%, var(--line)); }
.fl-danger:hover { background: var(--fault-soft); }
.fl-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.fl-mono-h { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: 0; overflow-wrap: anywhere; }
.fl-bignum { font-size: 14px; color: var(--ink-2); }
.fl-bignum b { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 2px; }
.fl-meter { display: inline-block; width: 54px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; overflow: hidden; }
.fl-meter i { display: block; height: 100%; background: var(--accent); }
.fl-trow .fl-counts { align-items: center; }
.fl-picks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.fl-pick { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.fl-pick:hover { background: var(--accent-soft); }
.fl-pick .l { font-weight: 600; font-size: 13px; }
.fl-pick .p { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.fl-cut { grid-template-columns: 30px 1fr; }
.fl-cutn { font: 600 15px var(--mono); color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.fl-cut .t { font-family: var(--mono); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.fl-drop { color: var(--touch); font-weight: 500; }
.fl-chain { list-style: none; margin: 0; padding: 0 0 0 14px; display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--accent); }
.fl-chain li { position: relative; padding: 5px 0 7px 8px; }
.fl-chain li::before { content: ""; position: absolute; left: -20px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.fl-chain .path { font-family: var(--mono); font-size: 11.5px; color: var(--ink); overflow-wrap: anywhere; }
.fl-chain .meta { font-size: 11.5px; color: var(--muted); }
.fl-chain .meta b { font-family: var(--mono); font-weight: 500; color: var(--ink-2); }
.fl-chain .sys { color: var(--accent); }
.fl-files-b { display: flex; flex-direction: column; gap: 2px; }
.fl-fbtn { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
.fl-fbtn:hover { background: var(--accent-soft); }
.fl-fbtn .p { overflow-wrap: anywhere; min-width: 0; }
.fl-fbtn .x { color: var(--muted); white-space: nowrap; }
.fl-loose { border: 1px solid color-mix(in srgb, var(--fault) 40%, transparent); background: var(--fault-soft); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.fl-loose .t { font-weight: 600; color: var(--fault); font-size: 13px; }
.fl-loose ul { margin: 6px 0; padding-left: 18px; }
.fl-loose .d { color: var(--muted); }
.fl-sugs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fl-sug { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.fl-sug .b { min-width: 0; }
.fl-sug .t { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.fl-sug .t code { font-family: var(--mono); font-size: 12px; }
.fl-sug .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.fl-sug-actions { display: flex; flex-direction: column; gap: 4px; }
.fl-quiet { color: var(--muted); }
.fl-toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 3; background: var(--ink); color: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow); pointer-events: none; }

@media (max-width: 860px) {
  .fl-app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(320px, 58%) 1fr;
    grid-template-areas: "top" "map" "panel";
  }
  .fl-panel { border-left: 0; border-top: 1px solid var(--line); }
  .fl-repo { display: none; }
  .fl-range { max-width: 60vw; }
  .fl-legend { display: none; }
}
.fl-panel-body > .fl-input { flex: none; }

<script>
/* faultline map UI. Plain JS, no build step. Reads either window.__FAULTLINE_STATE__ (exported
   file) or the live server (/api/state + /events). */
(() => {
  "use strict";

  const SVG = "http://www.w3.org/2000/svg";
  const root = document.getElementById("faultline");
  const STATIC = window.__FAULTLINE_STATE__ || null;

  let S = null; // MapState
  const ui = {
    snap: -1, // selected snapshot index
    compare: "base", // "base" | "prev"
    view: { kind: "systems" }, // or { kind: "system", id }
    sel: null, // { type: "system"|"module"|"edge", ... }
    showTypes: false,
    playing: false,
    onlyStructural: null, // null = decide by timeline length
    transform: { x: 0, y: 0, k: 1 },
    fitted: "",
    followLive: true,
    fp: null, // footprint of one entry file, see computeFootprint
    fpChain: null, // files on the chain being explained: { files: Set<index> }
  };

  // ---------- tiny DOM helpers ----------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat(Infinity)) if (kid) el.append(kid);
    return el;
  }
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const baseName = (p) => (p || "").split("/").pop();

  // ---------- state access ----------
  const snap = (i = ui.snap) => S.snapshots[i];
  function systemsAt(i = ui.snap) {
    for (let j = i; j >= 0; j--) if (S.snapshots[j].systems) return S.snapshots[j].systems;
    return [];
  }
  function edgesAt(i, key) {
    for (let j = i; j >= 0; j--) if (S.snapshots[j][key]) return S.snapshots[j][key];
    return [];
  }
  function dv(i = ui.snap) {
    const sn = snap(i);
    if (!sn || i === 0) return null;
    if (ui.compare === "base" && sn.vsBase) return sn.vsBase;
    return sn.vsPrev;
  }
  const canCompareBase = (i = ui.snap) => i > 0 && !!snap(i)?.vsBase;
  const sysDef = (id) => S.config.systems.find((x) => x.id === id);
  function sysName(id) {
    if (id === "unmapped") return "Unmapped";
    return sysDef(id)?.name || id;
  }
  const modLabel = (mid) => mid.slice(mid.indexOf("/") + 1);
  const modSystem = (mid) => mid.slice(0, mid.indexOf("/"));
  const key = (a, b) => `${a}\u0000${b}`;

  function changeSets(d) {
    const out = {
      newSys: new Set(), goneSys: new Map(), grownSys: new Set(), faultSys: new Set(), oldFaultSys: new Set(),
      newMod: new Set(), goneMod: new Map(), touchedSys: new Map(), touchedMod: new Map(), newEvidence: new Set(),
    };
    if (!d) return out;
    const D = d.delta;
    for (const e of D.systemEdges.added) out.newSys.add(key(e.from, e.to));
    for (const e of D.systemEdges.removed) out.goneSys.set(key(e.from, e.to), e);
    for (const e of D.systemEdges.grown) out.grownSys.add(key(e.from, e.to));
    for (const v of D.violations.introduced) out.faultSys.add(key(v.from, v.to));
    for (const v of D.violations.existing) out.oldFaultSys.add(key(v.from, v.to));
    for (const e of D.moduleEdges.added) out.newMod.add(key(e.from, e.to));
    for (const e of D.moduleEdges.removed) out.goneMod.set(key(e.from, e.to), e);
    for (const t of D.touched) out.touchedSys.set(t.system, t);
    for (const [p, m] of Object.entries(d.fileModule || {})) {
      if (!m) continue;
      let t = out.touchedMod.get(m);
      if (!t) out.touchedMod.set(m, (t = { added: [], modified: [], removed: [] }));
      const sys = modSystem(m);
      const ts = out.touchedSys.get(sys);
      if (ts?.added.includes(p)) t.added.push(p);
      else if (ts?.removed.includes(p)) t.removed.push(p);
      else t.modified.push(p);
    }
    const evKey = (e) => `${e.from}\u0000${e.to}`;
    for (const list of [D.systemEdges.added, D.systemEdges.grown, D.moduleEdges.added]) for (const c of list) for (const e of c.evidence) out.newEvidence.add(evKey(e));
    for (const v of D.violations.introduced) for (const e of v.evidence) out.newEvidence.add(evKey(e));
    return out;
  }

  // ---------- evidence ----------
  function evidence(filter) {
    const last = S.snapshots.length - 1;
    const d = dv();
    const C = changeSets(d);
    const g = S.graph;
    const results = [];
    const seen = new Set();
    const push = (e, isNew) => {
      const k = e.from + "\u0000" + e.to;
      if (seen.has(k)) return;
      seen.add(k);
      results.push({ ...e, isNew: isNew || C.newEvidence.has(k) });
    };
    let complete = false;
    if (ui.snap === last && g) {
      complete = true;
      for (const [fi, ti, names, flags] of g.edges) {
        const e = { from: g.paths[fi], to: g.paths[ti], fs: g.system[fi], ts: g.system[ti], fm: g.module[fi], tm: g.module[ti] };
        if (!filter(e)) continue;
        push({ from: e.from, to: e.to, names: names ? names.split(",") : [], typeOnly: !!(flags & 1), kind: flags & 4 ? "reexport" : flags & 2 ? "dynamic" : "static" }, false);
      }
    }
    if (d) {
      const D = d.delta;
      const fileSys = (p) => sysOfPath(p);
      const lists = [...D.systemEdges.added, ...D.systemEdges.grown, ...D.moduleEdges.added, ...D.violations.introduced];
      for (const c of lists) for (const e of c.evidence) {
        const ee = { from: e.from, to: e.to, fs: fileSys(e.from), ts: fileSys(e.to), fm: e.fm, tm: e.tm };
        if (filter(ee)) push(e, true);
      }
    }
    results.sort((a, b) => Number(b.isNew) - Number(a.isNew) || a.from.localeCompare(b.from));

  }
  function sysOfPath(p) {
    const g = S.graph;
    const i = g ? binarySearch(g.paths, p) : -1;
    if (i >= 0) return g.system[i];
    // Fall back to the module annotations carried on changes.
    for (const sn of S.snapshots) {
      const m = sn.vsBase?.fileModule?.[p] || sn.vsPrev?.fileModule?.[p];
      if (m) return modSystem(m);
    }
    return "";
  }
  function binarySearch(arr, v) {
    let lo = 0, hi = arr.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid] === v) return mid;
      if (arr[mid] < v) lo = mid + 1; else hi = mid - 1;
    }
    return -1;
  }

  // ---------- footprint ----------
  /**
   * What loads when `entryPath` is imported, from the latest graph: files reached by static,
   * non-type imports load at startup; files reached only through import() load on demand.
   * Cut points come from the dominator tree: every startup path to a file passes through its
   * dominators, so no longer importing one drops its whole subtree.
   */
  function computeFootprint(entryPath) {
    const g = S.graph;
    const ei = g ? binarySearch(g.paths, entryPath) : -1;
    if (ei < 0) return null;
    const n = g.paths.length;
    const out = Array.from({ length: n }, () => []);
    const lazy = Array.from({ length: n }, () => []);
    const names = new Map();
    for (const [a, b, nm, fl] of g.edges) {
      if (fl & 1) continue;
      if (fl & 2) lazy[a].push(b);
      else { out[a].push(b); names.set(a * n + b, nm); }
    }
    // Breadth first, so the parent chain is a shortest "why does this load".
    const parent = new Int32Array(n).fill(-2);
    parent[ei] = -1;
    const order = [ei];
    for (let i = 0; i < order.length; i++) for (const t of out[order[i]]) if (parent[t] === -2) { parent[t] = order[i]; order.push(t); }
    const startup = new Set(order);
    const later = new Set();
    const queue = [];
    for (const f of order) for (const t of lazy[f]) if (!startup.has(t)) queue.push(t);
    while (queue.length) {
      const f = queue.pop();
      if (startup.has(f) || later.has(f)) continue;
      later.add(f);
      for (const t of out[f]) queue.push(t);
      for (const t of lazy[f]) queue.push(t);
    }
    const bySys = new Map(), byMod = new Map();
    const bump = (map, k, field) => { const c = map.get(k) || map.set(k, { startup: 0, onDemand: 0, total: 0 }).get(k); c[field]++; };
    for (let i = 0; i < n; i++) {
      bump(bySys, g.system[i], "total"); bump(byMod, g.module[i], "total");
      if (startup.has(i)) { bump(bySys, g.system[i], "startup"); bump(byMod, g.module[i], "startup"); }
      else if (later.has(i)) { bump(bySys, g.system[i], "onDemand"); bump(byMod, g.module[i], "onDemand"); }
    }
    const sysPairs = new Set(), modPairs = new Set();
    for (const f of order) for (const t of out[f]) {
      if (g.system[f] !== g.system[t]) sysPairs.add(key(g.system[f], g.system[t]));
      if (g.module[f] !== g.module[t]) modPairs.add(key(g.module[f], g.module[t]));
    }
    const pkgs = new Map();
    for (const [fi, pkg, fl] of g.ext || []) {
      if (fl || !startup.has(fi) || pkg.startsWith("virtual:")) continue;
      (pkgs.get(pkg) || pkgs.set(pkg, []).get(pkg)).push(fi);
    }
    const idom = dominators(ei, order, out, startup);
    const kids = new Map();
    for (const f of order) if (f !== ei) (kids.get(idom[f]) || kids.set(idom[f], []).get(idom[f])).push(f);
    const subtree = (f) => { const all = [f]; for (let i = 0; i < all.length; i++) for (const k of kids.get(all[i]) || []) all.push(k); return all; };
    const importers = new Map();
    for (const f of order) for (const t of out[f]) (importers.get(t) || importers.set(t, []).get(t)).push(f);
    const candidates = order.filter((f) => f !== ei).map((f) => ({ f, drops: subtree(f) })).filter((c) => c.drops.length >= 2 && c.drops.length <= order.length * 0.5).sort((a, b) => b.drops.length - a.drops.length);
    const covered = new Set();
    const cuts = [];
    for (const c of candidates) {
      if (covered.has(c.f)) continue;
      c.drops.forEach((x) => covered.add(x));
      const dropped = new Set(c.drops);
      const lost = [...pkgs].filter(([, users]) => users.every((u) => dropped.has(u))).map(([p]) => p).sort();
      cuts.push({ file: c.f, drops: c.drops, packages: lost, importers: importers.get(c.f) || [] });
      if (cuts.length >= 12) break;
    }
    const label = (S.entries || []).find((e) => e.path === entryPath)?.label || "";
    return { entry: entryPath, ei, label, startup, later, parent, idom, names, n, bySys, byMod, sysPairs, modPairs, pkgs, cuts, importers };
  }

  function dominators(entry, nodes, out, inSet) {
    const rpo = [];

      const top = stack[stack.length - 1];

    idom[entry] = entry;
    const meet = (a, b) => {
      while (a !== b) {
        while (index.get(a) > index.get(b)) a = idom[a];
        while (index.get(b) > index.get(a)) b = idom[b];
      }
      return a;
    };
    for (let changed = true; changed;) {
      changed = false;
      for (const f of rpo) {
        if (f === entry) continue;
        let d;
        for (const p of preds.get(f) || []) if (idom[p] !== undefined) d = d === undefined ? p : meet(p, d);
        if (d !== undefined && idom[f] !== d) { idom[f] = d; changed = true; }
      }
    }
    return idom;
  }

  /** The shortest startup chain from the entry to a file, as indexes. */
  function chainOf(fp, f) {
    const chain = [];
    for (let c = f; c >= 0; c = fp.parent[c]) chain.unshift(c);
    return fp.parent[f] === -2 ? [] : chain;
  }
  function setFootprint(path) {
    ui.fp = path ? computeFootprint(path) : null;
    ui.fpChain = null;
    ui.sel = null;
    render();
  }
  function explainPkg(pkg) {
    const users = ui.fp.pkgs.get(pkg) || [];
    ui.fpChain = { files: new Set(users.flatMap((u) => chainOf(ui.fp, u))) };
    select({ type: "fp-pkg", pkg });
  }
  function explain(f) {
    ui.fpChain = { files: new Set(chainOf(ui.fp, f)) };
    select({ type: "fp-file", file: f });
  }
  const fpOf = (map, id) => (ui.fp ? map.get(id) || { startup: 0, onDemand: 0, total: 0 } : null);
  const chainSystems = () => {
    if (!ui.fp || !ui.fpChain) return null;
    const g = S.graph;
    const list = [...ui.fpChain.files];
    return { sys: new Set(list.map((i) => g.system[i])), mod: new Set(list.map((i) => g.module[i])), sysPairs: new Set(list.slice(1).map((f, i) => key(g.system[list[i]], g.system[f]))), modPairs: new Set(list.slice(1).map((f, i) => key(g.module[list[i]], g.module[f]))) };
  };

  // ---------- scene building ----------
  function buildSystemScene() {
    const sn = snap();
    const d = dv();
    const C = changeSets(d);
    const CH = chainSystems();
    const present = new Map(systemsAt().map((x) => [x.id, x]));
    const everywhere = new Set();
    for (const s2 of S.snapshots) for (const x of s2.systems || []) if (x.files > 0) everywhere.add(x.id);
    const nodes = [];
    for (const [id, box] of Object.entries(S.layout.systems)) {
      const v = present.get(id);
      if (!everywhere.has(id)) continue;
      const files = v ? v.files : 0;
      const fp = fpOf(ui.fp?.bySys, id);
      const sub = fp ? (fp.startup ? `${fp.startup} of ${fp.total} load` : fp.onDemand ? `${fp.onDemand} on demand` : "not loaded") : files ? `${plural(files, "file")} · ${plural(v.modules.length, "module")}` : "no files here yet";
      nodes.push({ id, kind: "system", box, name: sysName(id), files, sub, fp, chain: CH?.sys.has(id), touched: C.touchedSys.get(id), ghost: files === 0 });
    }
    const ids = new Set(nodes.map((n) => n.id));
    const edges = [];
    for (const e of edgesAt(ui.snap, "systemEdges")) {
      if (!ids.has(e.from) || !ids.has(e.to)) continue;
      const k = key(e.from, e.to);
      const state = C.faultSys.has(k) ? "fault" : C.newSys.has(k) ? "new" : C.oldFaultSys.has(k) ? "fault-old" : C.grownSys.has(k) ? "grown" : "";
      if (e.typeOnly && !ui.showTypes && !state) continue;
      edges.push({ id: "s|" + k, from: e.from, to: e.to, count: e.count, typeOnly: e.typeOnly, state, level: "system", load: ui.fp ? ui.fp.sysPairs.has(k) : undefined, chain: CH?.sysPairs.has(k) });
    }
    for (const [k, e] of C.goneSys) if (ids.has(e.from) && ids.has(e.to)) edges.push({ id: "s|" + k, from: e.from, to: e.to, count: e.count, typeOnly: e.typeOnly, state: "gone", level: "system" });
    // Intended dependencies: dashed until the code exists, then marked as planned.
    for (const p of (S.plan && S.plan.edges) || []) {
      if (!ids.has(p.from) || !ids.has(p.to)) continue;
      const hit = edges.find((e) => e.from === p.from && e.to === p.to);
      if (hit) hit.planned = true;
      else edges.push({ id: "s|" + key(p.from, p.to), from: p.from, to: p.to, count: 0, typeOnly: false, state: "planned", level: "system", planned: true, why: p.why });
    }
    return { nodes, edges };
  }

  function buildDrillScene(sysId) {
    const sn = snap();
    const d = dv();
    const C = changeSets(d);
    const CH = chainSystems();
    const sv = systemsAt().find((x) => x.id === sysId) || { modules: [], files: 0 };
    const mods = sv.modules.slice();
    if (d) for (const mid of d.delta.modules.removed) if (modSystem(mid) === sysId && !mods.some((m) => m.id === mid)) mods.push({ id: mid, label: modLabel(mid), files: 0, ghost: true });
    // Stable order: by size, then name, so a new module lands at the end rather than reshuffling.
    const order = new Map((S.snapshots[0].systems.find((x) => x.id === sysId)?.modules || []).map((m, i) => [m.id, i]));
    mods.sort((a, b) => (order.has(a.id) ? order.get(a.id) : 1e6) - (order.has(b.id) ? order.get(b.id) : 1e6) || b.files - a.files || a.id.localeCompare(b.id));

    const modEdges = edgesAt(ui.snap, "moduleEdges");
    const inner = [];
    const outAgg = new Map();
    const inAgg = new Map();
    const bump = (map, k, e, extra) => {
      const cur = map.get(k);
      if (cur) { cur.count += e.count; cur.typeOnly = cur.typeOnly && e.typeOnly; if (extra.state && !cur.state) cur.state = extra.state; }
      else map.set(k, { ...extra, count: e.count, typeOnly: e.typeOnly });
    };
    const stateOf = (e) => {
      const k = key(e.from, e.to);
      if (C.newMod.has(k)) {
        const sk = key(modSystem(e.from), modSystem(e.to));
        return C.faultSys.has(sk) ? "fault" : "new";
      }
      const sk = key(modSystem(e.from), modSystem(e.to));
      if (C.oldFaultSys.has(sk)) return "fault-old";
      return "";
    };
    const all = modEdges.map((e) => ({ ...e, state: stateOf(e) }));
    for (const [k, e] of C.goneMod) all.push({ ...e, state: "gone" });
    for (const e of all) {
      const fs = modSystem(e.from), ts = modSystem(e.to);
      if (fs === sysId && ts === sysId) inner.push(e);
      else if (fs === sysId) bump(outAgg, key(e.from, ts), e, { from: e.from, to: "sys:" + ts, state: e.state });
      else if (ts === sysId) bump(inAgg, key(fs, e.to), e, { from: "sys:" + fs, to: e.to, state: e.state });
    }
    const weight = (id, map, side) => [...map.values()].filter((e) => (side === "to" ? e.to : e.from) === "sys:" + id).reduce((n, e) => n + e.count, 0);
    // Each neighbour sits on the side it mostly talks to: callers on the left, dependencies on the right.
    const neighbours = new Set([...[...outAgg.values()].map((e) => e.to.slice(4)), ...[...inAgg.values()].map((e) => e.from.slice(4))]);
    const inSys = [], outSys = [];
    for (const id of neighbours) (weight(id, inAgg, "from") > weight(id, outAgg, "to") ? inSys : outSys).push(id);
    outSys.sort((a, b) => weight(b, outAgg, "to") - weight(a, outAgg, "to"));
    inSys.sort((a, b) => weight(b, inAgg, "from") - weight(a, inAgg, "from"));
    // Modules sit in the folder they came from (a system spread over core/app, core/session...
    // shows each folder as its own group), neighbours in columns either side.
    const cw = 168, ch = 50, gap = 16;
    const padTop = 40, pad = 22;
    const groupOf = (m) => { const i = m.label.lastIndexOf("/"); return i > 0 ? m.label.slice(0, i) : ""; };
    const groups = new Map();
    for (const m of mods) (groups.get(groupOf(m)) || groups.set(groupOf(m), []).get(groupOf(m))).push(m);
    const grouped = groups.size > 1;
    const cells = []; // [module, x, y] relative to the container
    const groupBoxes = [];
    let innerW, innerH;
    if (!grouped) {
      const cols = Math.max(1, Math.min(6, Math.ceil(Math.sqrt(mods.length * 1.5))));
      const rows = Math.ceil(mods.length / cols) || 1;
      mods.forEach((m, i) => cells.push([m, pad + (i % cols) * (cw + gap), padTop + Math.floor(i / cols) * (ch + gap)]));
      innerW = cols * cw + (cols - 1) * gap + pad * 2;
      innerH = rows * ch + (rows - 1) * gap + padTop + pad;
    } else {
      const gp = 12, gt = 30;
      // A footprint is about what loads: the rest of each folder folds into one quiet box.
      if (ui.fp) for (const [name, ms] of groups) {
        const quiet = ms.filter((m) => { const f = ui.fp.byMod.get(m.id); return !f || (!f.startup && !f.onDemand); });
        if (quiet.length < 2) continue;
        const keep = ms.filter((m) => !quiet.includes(m));
        keep.push({ id: `more:${name}`, label: `${name}/${quiet.length} more`, files: quiet.reduce((a, m) => a + m.files, 0), folded: quiet.length, ghost: true });
        groups.set(name, keep);
      }
      const list = [...groups].map(([name, ms]) => {
        const cols = Math.min(3, Math.max(1, Math.ceil(Math.sqrt(ms.length))));
        const rows = Math.ceil(ms.length / cols);
        return { name, ms, cols, w: cols * cw + (cols - 1) * gap + gp * 2, h: gt + rows * ch + (rows - 1) * gap + gp, files: ms.reduce((a, m) => a + m.files, 0) };
      }).sort((a, b) => b.ms.length - a.ms.length || b.files - a.files || a.name.localeCompare(b.name));
      // Shelf packing: fill rows up to a width that matches the room the neighbour columns leave.
      const area = list.reduce((a, x) => a + (x.w + gap) * (x.h + gap), 0);
      const W = els.map?.clientWidth || 1000, H = els.map?.clientHeight || 700;
      const sideCols = (inSys.length ? 1 : 0) + (outSys.length ? 1 : 0);
      const aspect = Math.max(1.1, Math.min(1.8, (W - sideCols * 290) / Math.max(200, H - 120)));
      const maxW = Math.max(...list.map((x) => x.w), Math.sqrt(area * aspect));
      let x = 0, y = 0, rowH = 0, widest = 0;
      for (const grp of list) {
        if (x > 0 && x + grp.w > maxW) { x = 0; y += rowH + gap; rowH = 0; }
        groupBoxes.push({ x: pad + x, y: padTop + y, w: grp.w, h: grp.h, title: grp.name });
        grp.ms.forEach((m, i) => cells.push([m, pad + x + gp + (i % grp.cols) * (cw + gap), padTop + y + gt + Math.floor(i / grp.cols) * (ch + gap)]));
        x += grp.w + gap;
        widest = Math.max(widest, x - gap);
        rowH = Math.max(rowH, grp.h);
      }
      innerW = widest + pad * 2;
      innerH = padTop + y + rowH + pad;
    }
    const colW = 190;
    const perCol = Math.max(5, Math.floor(innerH / 56));
    const leftCols = Math.ceil(inSys.length / perCol);
    const cx = leftCols ? leftCols * (colW + 24) + 70 : 0;
    const contW = innerW, contH = innerH;
    const rightX = cx + contW + 70;
    const nodes = [];
    for (const [m, x, y] of cells) {
      if (m.folded) {
        nodes.push({ id: m.id, kind: "folded", name: `${m.folded} more`, sub: "not loaded", ghost: true, box: { x: cx + x, y, w: cw, h: ch } });
        continue;
      }
      const fp = fpOf(ui.fp?.byMod, m.id);
      nodes.push({
        id: m.id, kind: "module", name: grouped ? m.label.slice(m.label.lastIndexOf("/") + 1) : m.label, files: m.files, ghost: m.ghost || m.files === 0, fp, chain: CH?.mod.has(m.id),
        sub: fp ? (fp.startup ? `${fp.startup} of ${fp.total} load` : fp.onDemand ? `${fp.onDemand} on demand` : "not loaded") : m.files ? plural(m.files, "file") : "removed",
        box: { x: cx + x, y, w: cw, h: ch },
        touched: C.touchedMod.get(m.id),
      });
    }
    const column = (list, x0, dir) => {
      const hh = 44, g2 = 12;
      for (let c = 0; c * perCol < list.length; c++) {
        const chunk = list.slice(c * perCol, (c + 1) * perCol);
        const total = chunk.length * hh + Math.max(0, chunk.length - 1) * g2;
        const y0 = (contH - total) / 2;
        const x = x0 + dir * c * (colW + 24);
        chunk.forEach((id, i) => {
          const fp = fpOf(ui.fp?.bySys, id);
          nodes.push({ id: "sys:" + id, sysId: id, kind: "neighbour", name: sysName(id), sub: fp ? (fp.startup ? `${fp.startup} of ${fp.total} load` : "not loaded") : "system", fp, chain: CH?.sys.has(id), box: { x, y: y0 + i * (hh + g2), w: colW, h: hh }, touched: C.touchedSys.get(id) });
        });
      }
    };
    column(inSys, cx - 70 - colW, -1);
    column(outSys, rightX, 1);
    // An endpoint is a module, a folder group ("grp:<name>") or a neighbouring system ("sys:<id>").
    const groupOfMod = new Map(mods.map((m) => [m.id, groupOf(m)]));
    const endpointOf = (mid) => (grouped && modSystem(mid) === sysId ? "grp:" + groupOfMod.get(mid) : mid);
    const matches = (end, mid) => (end.startsWith("sys:") ? modSystem(mid) === end.slice(4) : end.startsWith("grp:") ? modSystem(mid) === sysId && groupOfMod.get(mid) === end.slice(4) : end === mid);
    const anyPair = (pairs, e) => {
      if (!pairs) return false;
      if (!e.from.includes(":") && !e.to.includes(":")) return pairs.has(key(e.from, e.to));
      for (const k of pairs) {
        const i = k.indexOf("\u0000");
        if (matches(e.from, k.slice(0, i)) && matches(e.to, k.slice(i + 1))) return true;
      }
      return false;
    };
    const selMod = ui.sel?.type === "module" && modSystem(ui.sel.id) === sysId ? ui.sel.id : null;
    const edges = [];
    const push = (e, level) => {
      if (e.typeOnly && !ui.showTypes && !e.state) return;
      edges.push({ ...e, id: (level === "module" ? "m|" : level === "group" ? "g|" : "x|") + key(e.from, e.to), level, load: ui.fp ? anyPair(ui.fp.modPairs, e) : undefined, chain: anyPair(CH?.modPairs, e) });
    };
    if (!grouped) {
      for (const e of inner) push(e, "module");
      for (const e of [...outAgg.values(), ...inAgg.values()]) push(e, "mixed");
    } else {
      // Folders talk to folders; a selected module shows its own imports on top.
      const agg = new Map();
      for (const e of [...inner, ...outAgg.values(), ...inAgg.values()]) {
        const from = e.from.startsWith("sys:") ? e.from : endpointOf(e.from);
        const to = e.to.startsWith("sys:") ? e.to : endpointOf(e.to);
        if (from === to) continue;
        const k = key(from, to);
        const cur = agg.get(k);
        if (cur) { cur.count += e.count; cur.typeOnly = cur.typeOnly && e.typeOnly; if (e.state && !cur.state) cur.state = e.state; }
        else agg.set(k, { from, to, count: e.count, typeOnly: e.typeOnly, state: e.state });
      }
      for (const e of agg.values()) push(e, "group");
      if (selMod) for (const e of [...inner, ...outAgg.values(), ...inAgg.values()]) if (e.from === selMod || e.to === selMod) push(e, e.from.startsWith("sys:") || e.to.startsWith("sys:") ? "mixed" : "module");
    }
    const pseudo = groupBoxes.map((b) => ({ id: "grp:" + b.title, box: { ...b, x: b.x + cx } }));
    return { nodes, edges, pseudo, groups: groupBoxes.map((b) => ({ ...b, x: b.x + cx })), container: { x: cx, y: 0, w: contW, h: contH, title: sysName(sysId) } };
  }

  // ---------- geometry ----------
  function routeAll(nodes, edges) {
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const pairs = new Set(edges.map((e) => key(e.from, e.to)));
    const ports = new Map(); // node|side -> [{edge, end, other}]
    const plan = [];
    for (const e of edges) {
      const a = byId.get(e.from), b = byId.get(e.to);
      if (!a || !b) continue;
      const A = a.box, B = b.box;
      const ax = A.x + A.w / 2, ay = A.y + A.h / 2, bx = B.x + B.w / 2, by = B.y + B.h / 2;
      const dx = bx - ax, dy = by - ay;
      const horiz = Math.abs(dx) > Math.abs(dy) * 0.9;
      const sa = horiz ? (dx >= 0 ? "r" : "l") : dy >= 0 ? "b" : "t";
      const sb = horiz ? (dx >= 0 ? "l" : "r") : dy >= 0 ? "t" : "b";
      const p = { e, a, b, sa, sb, both: pairs.has(key(e.to, e.from)) };
      plan.push(p);
      for (const [n, side, other] of [[a, sa, b], [b, sb, a]]) {
        const k = n.id + "|" + side;
        if (!ports.has(k)) ports.set(k, []);
        ports.get(k).push({ p, end: n === a ? "a" : "b", other });
      }
    }
    // Spread endpoints along each side, ordered by where the other end sits, to untangle bundles.
    const offset = new Map();
    for (const [k, list] of ports) {
      const side = k.slice(k.lastIndexOf("|") + 1);
      const vertical = side === "l" || side === "r";
      list.sort((u, v) => (vertical ? u.other.box.y - v.other.box.y : u.other.box.x - v.other.box.x));
      const n = list.length;
      list.forEach((item, i) => {
        const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * 0.7;
        offset.set(item.p.e.id + "|" + item.end, t);
      });
    }
    const pt = (box, side, t) => {
      if (side === "r") return { x: box.x + box.w, y: box.y + box.h / 2 + t * box.h, nx: 1, ny: 0 };
      if (side === "l") return { x: box.x, y: box.y + box.h / 2 + t * box.h, nx: -1, ny: 0 };
      if (side === "b") return { x: box.x + box.w / 2 + t * box.w, y: box.y + box.h, nx: 0, ny: 1 };
      return { x: box.x + box.w / 2 + t * box.w, y: box.y, nx: 0, ny: -1 };
    };
    return plan.map((p) => {
      const p1 = pt(p.a.box, p.sa, offset.get(p.e.id + "|a") || 0);
      const p2 = pt(p.b.box, p.sb, offset.get(p.e.id + "|b") || 0);
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const c = Math.max(24, Math.min(140, dist * 0.42));
      const bend = p.both ? 10 : 0;
      const bx = -p1.ny * bend, by = p1.nx * bend;
      const d = `M${r(p1.x)},${r(p1.y)} C${r(p1.x + p1.nx * c + bx)},${r(p1.y + p1.ny * c + by)} ${r(p2.x + p2.nx * (c + 8) + bx)},${r(p2.y + p2.ny * (c + 8) + by)} ${r(p2.x + p2.nx * 7)},${r(p2.y + p2.ny * 7)}`;
      return { ...p.e, d };
    });
  }
  const r = (v) => Math.round(v * 10) / 10;

  // ---------- rendering ----------
  let els = {};
  function mount() {
    root.innerHTML = "";
    root.className = "fl-app";
    els.top = h("header", { class: "fl-top" });
    els.map = h("main", { class: "fl-map", "aria-label": "Architecture map" });
    els.panel = h("aside", { class: "fl-panel" });
    root.append(els.top, els.map, els.panel);
    els.svg = s("svg", { role: "img", "aria-label": "Systems and their dependencies" });
    els.defs = s("defs");
    for (const [id, cls] of [["a-default", "arrow-default"], ["a-new", "arrow-new"], ["a-fault", "arrow-fault"], ["a-accent", "arrow-accent"], ["a-hot", "arrow-hot"]]) {
      els.defs.append(s("marker", { id, viewBox: "0 0 10 10", refX: "3", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" }, s("path", { d: "M0,0 L10,5 L0,10 z", class: cls })));
    }
    els.vp = s("g");
    els.svg.append(els.defs, els.vp);
    els.crumbs = h("nav", { class: "fl-crumbs", "aria-label": "Breadcrumb" });
    els.tools = h("div", { class: "fl-tools" });
    els.legend = h("div", { class: "fl-legend" });
    els.map.append(els.svg, els.crumbs, els.tools, els.legend);
    bindPanZoom();
    window.addEventListener("resize", () => { ui.fitted = ""; renderMap(); });
    document.addEventListener("keydown", onKey);
  }

  function render() {
    renderTop();
    renderMap();
    renderPanel();
  }

  function renderTop() {
    const sn = snap();
    const base = S.snapshots[0];
    const from = (ui.compare === "prev" || !canCompareBase()) && ui.snap > 0 ? S.snapshots[ui.snap - 1] : base;
    const live = S.mode === "live";
    els.top.replaceChildren(...[
      h("div", { class: "fl-mark" }, logo(), "faultline"),
      h("div", { class: "fl-repo", title: S.repo }, S.repo),
      h("div", { class: "fl-spacer" }),
      ui.snap > 0 ? h("div", { class: "fl-range", title: `${from.label} → ${sn.label}` }, `${from.label} → ${sn.label}`) : h("div", { class: "fl-range" }, sn.label),
      live ? h("span", { class: "fl-live" + (liveStatus === "busy" ? " is-busy" : liveStatus === "off" ? " is-off" : ""), id: "fl-live" }, liveStatus === "off" ? "offline" : liveStatus === "busy" ? "updating" : "live") : null,
    ].filter(Boolean));
  }

  function logo() {
    return s("svg", { width: "20", height: "20", viewBox: "0 0 20 20", "aria-hidden": "true" },
      s("rect", { x: "1.5", y: "3", width: "8", height: "6", rx: "1.5", fill: "none", stroke: "currentColor", "stroke-width": "1.6" }),
      s("rect", { x: "10.5", y: "11", width: "8", height: "6", rx: "1.5", fill: "none", stroke: "currentColor", "stroke-width": "1.6" }),
      s("path", { d: "M2 16.5 L7 12.5 L10 14.5 L18 5.5", fill: "none", stroke: "var(--fault)", "stroke-width": "1.8", "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }

  let scene = null;
  let lastClick = { id: "", t: 0 };
  function renderMap() {
    scene = ui.view.kind === "system" ? buildDrillScene(ui.view.id) : buildSystemScene();

    const fpOn = !!ui.fp;
    for (const e of routed) {
      const w = e.id === selEdge || e.chain ? 3.6 : e.state === "new" || e.state === "fault" || e.state === "planned" ? 2.6 : 1 + Math.min(3.2, (Math.log2(e.count + 1) / Math.log2(maxCount + 1)) * 3.2);

  function panelModule(body, id) {

  function panelEdge(body) {
    const sel = ui.sel;

    const C = changeSets(d);
    const endpoint = (id) => (id.startsWith("sys:") ? { kind: "system", id: id.slice(4) } : id.startsWith("grp:") ? { kind: "group", id: `${ui.view.id}/${id.slice(4)}/` } : sel.level === "system" ? { kind: "system", id } : { kind: "module", id });

    if (list.length > 80) body.append(h("p", { class: "fl-sub", text: `…and ${list.length - 80} more.` }));

  /** Live mode: turn an edge into a rule, or plan and unplan it. Agents read both through faultline. */

  async function post(url, body) {

  // ---------- timeline ----------
  function stepKind(sn) {
    const d = sn.vsPrev;
    if (!d) return "";
    if (d.findings.some((f) => f.severity === "fault")) return "fault";
    if (d.findings.some((f) => f.severity === "structure")) return "structure";
    return "";
  }

  function timeline() {
    const n = S.snapshots.length;
    const wrap = h("div", { class: "fl-timeline" });
    const head = h("div", { class: "fl-tl-head" },
      h("h2", { class: "fl-label", style: "margin:0", text: S.mode === "live" ? "Session" : "Timeline" }),
      h("div", { class: "fl-seg", role: "group", "aria-label": "Compare against" },
        h("button", { "aria-pressed": String(ui.compare === "base" && canCompareBase()), disabled: !canCompareBase() || undefined, title: canCompareBase() ? "Everything since the first point" : "Available at the latest point", onclick: () => setCompare("base"), text: "Since start" }),
        h("button", { "aria-pressed": String(ui.compare === "prev" || !canCompareBase()), onclick: () => setCompare("prev"), text: "This step" })),
      n > 2 ? h("button", { class: "fl-btn", onclick: togglePlay, "aria-pressed": String(ui.playing), text: ui.playing ? "Pause" : "Play" }) : null,
      S.mode === "live" ? h("button", { class: "fl-btn", title: "Freeze the current state as a step", onclick: markTurn, text: "Mark step" }) : null,
    );
    wrap.append(head);
    if (n > 1) {
      const scrub = h("div", { class: "fl-scrub" });
      scrub.append(h("div", { class: "fl-track" }));
      const pct = (i) => (n === 1 ? 0 : (i / (n - 1)) * 100);
      S.snapshots.forEach((sn, i) => {
        const k = stepKind(sn);
        scrub.append(h("div", { class: "fl-tick" + (k ? " k-" + k : ""), style: `left:calc(6px + (100% - 12px) * ${pct(i) / 100})` }));
      });
      scrub.append(h("div", { class: "fl-thumb", style: `left:calc(6px + (100% - 12px) * ${pct(ui.snap) / 100})` }));
      const input = h("input", { type: "range", min: "0", max: String(n - 1), step: "1", value: String(ui.snap), "aria-label": "Point in time", id: "fl-scrub" });
      input.addEventListener("input", () => { setSnap(Number(input.value)); });
      scrub.append(input);
      wrap.append(scrub);
    }
    const onlyStructural = ui.onlyStructural ?? n > 30;
    const structuralCount = S.snapshots.filter((x) => stepKind(x)).length;
    if (n > 8) {
      wrap.append(h("label", { class: "fl-sub", style: "display:flex;gap:6px;align-items:center;margin:0;cursor:pointer" },
        h("input", { type: "checkbox", id: "fl-only-structural", checked: onlyStructural || undefined, onchange: (ev) => { ui.onlyStructural = ev.target.checked; renderPanel(); } }),
        `Only steps that changed the architecture (${structuralCount} of ${n - 1})`));
    }
    const list = h("ul", { class: "fl-steps" });
    for (let i = n - 1; i >= 0; i--) {
      const sn = S.snapshots[i];
      const k = stepKind(sn);
      if (onlyStructural && !k && i !== ui.snap && i !== 0 && i !== n - 1) continue;
      const btn = h("button", { class: "fl-step" + (i === ui.snap ? " is-current" : ""), onclick: () => setSnap(i) },
        h("span", { class: "k" + (k ? " k-" + k : "") }),
        h("span", { class: "s", text: sn.subject || sn.label }),
        h("span", { class: "r", text: sn.kind === "commit" || sn.kind === "base" ? sn.ref.slice(0, 7) : sn.kind === "live" ? "now" : timeAgo(sn.time) }));
      list.append(h("li", {}, btn));
    }
    wrap.append(list);
    requestAnimationFrame(() => { list.querySelector(".is-current")?.scrollIntoView({ block: "nearest" }); });
    return wrap;
  }

  function timeAgo(t) {
    const s2 = Math.max(0, (Date.now() - t) / 1000);
    if (s2 < 60) return `${Math.round(s2)}s ago`;
    if (s2 < 3600) return `${Math.round(s2 / 60)}m ago`;
    return `${Math.round(s2 / 3600)}h ago`;
  }

  // ---------- actions ----------
  function select(sel) {
    ui.sel = sel;
    if (!sel) ui.fpChain = null;
    renderMap();
    renderPanel();
  }
  function drill(id) {
    ui.view = { kind: "system", id };
    ui.sel = null;
    ui.fitted = "";
    render();
  }
  function back() {
    if (ui.sel) return select(null);
    if (ui.view.kind === "system") {
      ui.view = { kind: "systems" };
      ui.fitted = "";
      render();
    }
  }
  function setSnap(i) {
    const next = Math.max(0, Math.min(S.snapshots.length - 1, i));
    // A selection belongs to one point in time; moving on shows that step's own findings.
    if (next !== ui.snap) ui.sel = null;
    ui.snap = next;
    ui.followLive = ui.snap === S.snapshots.length - 1;
    render();
  }
  function setCompare(c) {
    ui.compare = c;
    render();
  }
  let playTimer = null;
  function togglePlay() {
    ui.playing = !ui.playing;
    clearInterval(playTimer);
    if (ui.playing) {
      if (ui.snap >= S.snapshots.length - 1) setSnap(0);
      ui.compare = "prev";
      playTimer = setInterval(() => {
        if (ui.snap >= S.snapshots.length - 1) { ui.playing = false; clearInterval(playTimer); render(); return; }
        // Skip quiet commits quickly, linger on structural ones.
        setSnap(ui.snap + 1);
      }, 900);
    }
    render();
  }
  function onKey(ev) {
    if (ev.target.closest && ev.target.closest("input, textarea")) return;
    if (ev.key === "Escape") back();
    else if (ev.key === "f" || ev.key === "F") { fit(); applyTransform(); }
    else if (ev.key === "ArrowLeft" && S.snapshots.length > 1) setSnap(ui.snap - 1);
    else if (ev.key === "ArrowRight" && S.snapshots.length > 1) setSnap(ui.snap + 1);
  }

  // ---------- pan & zoom ----------
  let moved = false;
  function applyTransform() {
    const t = ui.transform;
    els.vp.setAttribute("transform", `translate(${t.x},${t.y}) scale(${t.k})`);
  }
  function fit() {
    if (!scene) return;
    let boxes = scene.nodes.map((n) => n.box);
    if (scene.container) boxes.push(scene.container);
    // On a phone the whole map is too small to read: frame what changed instead.
    if ((els.map.clientWidth || 800) < 600 && ui.view.kind === "systems") {
      const hot = new Set();
      for (const e of scene.edges) if (e.state && e.state !== "fault-old" && e.state !== "grown") { hot.add(e.from); hot.add(e.to); }
      for (const n of scene.nodes) if (n.touched) hot.add(n.id);
      const focus = scene.nodes.filter((n) => hot.has(n.id)).map((n) => n.box);
      if (focus.length) boxes = focus;
    }
    // A footprint frames what loads; the rest stays visible around it, dimmed.
    if (ui.fp && ui.view.kind === "systems") {
      const loaded = scene.nodes.filter((n) => n.fp && (n.fp.startup || n.fp.onDemand)).map((n) => n.box);
      if (loaded.length) boxes = loaded;
    }
    if (!boxes.length) return;
    const x0 = Math.min(...boxes.map((b) => b.x)), y0 = Math.min(...boxes.map((b) => b.y));
    const x1 = Math.max(...boxes.map((b) => b.x + b.w)), y1 = Math.max(...boxes.map((b) => b.y + b.h));
    const W = els.map.clientWidth || 800, H = els.map.clientHeight || 600;
    const pad = 56;
    const k = Math.min((W - pad * 2) / (x1 - x0 || 1), (H - pad * 2 - 30) / (y1 - y0 || 1), 1.25);
    ui.transform = { k, x: (W - (x1 - x0) * k) / 2 - x0 * k, y: (H - (y1 - y0) * k) / 2 - y0 * k + 8 };
  }
  function bindPanZoom() {
    const pointers = new Map();
    let start = null;
    els.map.addEventListener("pointerdown", (ev) => {
      if (ev.target.closest(".fl-crumbs, .fl-tools, .fl-legend")) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      moved = false;
      start = { t: { ...ui.transform }, pts: new Map(pointers) };
      // Capture only once a drag starts: capturing on press re-targets the click away from the node.
    });
    els.map.addEventListener("pointermove", (ev) => {
      if (!pointers.has(ev.pointerId) || !start) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      const pts = [...pointers.values()];
      const spts = [...start.pts.values()];
      if (pts.length === 1 && spts.length >= 1) {
        const dx = pts[0].x - spts[0].x, dy = pts[0].y - spts[0].y;
        if (Math.abs(dx) + Math.abs(dy) > 4 && !moved) {
          moved = true;
          els.map.classList.add("is-panning");
          try { els.map.setPointerCapture(ev.pointerId); } catch { /* pointer already gone */ }
        }
        if (moved) { ui.transform = { ...start.t, x: start.t.x + dx, y: start.t.y + dy }; applyTransform(); }
      } else if (pts.length >= 2 && spts.length >= 2) {
        moved = true;
        const d0 = Math.hypot(spts[0].x - spts[1].x, spts[0].y - spts[1].y) || 1;
        const d1 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const rect = els.map.getBoundingClientRect();
        const cx = (spts[0].x + spts[1].x) / 2 - rect.left, cy = (spts[0].y + spts[1].y) / 2 - rect.top;
        zoomAt(start.t, cx, cy, d1 / d0);
      }
    });
    const end = (ev) => {
      pointers.delete(ev.pointerId);
      els.map.classList.remove("is-panning");
      if (pointers.size === 0) {
        if (!moved && ev.type === "pointerup" && (ev.target === els.svg || ev.target === els.map)) { if (ui.sel) select(null); }
        start = null;
        setTimeout(() => { moved = false; }, 0);
      } else start = { t: { ...ui.transform }, pts: new Map(pointers) };
    };
    els.map.addEventListener("pointerup", end);
    els.map.addEventListener("pointercancel", end);
    els.map.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const rect = els.map.getBoundingClientRect();
      const factor = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0022));
      zoomAt(ui.transform, ev.clientX - rect.left, ev.clientY - rect.top, factor);
    }, { passive: false });
  }
  function zoomAt(t0, cx, cy, factor) {
    const k = Math.max(0.15, Math.min(4, t0.k * factor));
    const f = k / t0.k;
    ui.transform = { k, x: cx - (cx - t0.x) * f, y: cy - (cy - t0.y) * f };
    applyTransform();
  }

  // ---------- live mode ----------
  let liveStatus = "ok";
  let booted = false;
  /** ?entry=<label or path> opens the map on that entry's footprint. */
  function openEntryFromUrl() {
    const want = new URLSearchParams(location.search).get("entry");
    if (!want || !S.graph) return;
    const e = (S.entries || []).find((x) => x.label === want || x.path === want);
    ui.fp = computeFootprint(e ? e.path : want);
  }
  async function loadLive() {
    const res = await fetch("/api/state", { cache: "no-store" });
    const next = await res.json();
    const wasLast = !S || ui.followLive;
    S = next;
    if (wasLast || ui.snap >= S.snapshots.length) ui.snap = S.snapshots.length - 1;
    if (ui.fp) ui.fp = computeFootprint(ui.fp.entry);
    else if (!booted) openEntryFromUrl();
    booted = true;
    render();
  }
  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("busy", () => { liveStatus = "busy"; setLive(); });
    es.addEventListener("state", () => { liveStatus = "ok"; loadLive().catch(() => {}); });
    es.onerror = () => { liveStatus = "off"; setLive(); };
    es.onopen = () => { if (liveStatus === "off") { liveStatus = "ok"; loadLive().catch(() => {}); } };
  }
  function setLive() {
    const el = document.getElementById("fl-live");
    if (!el) return;
    el.className = "fl-live" + (liveStatus === "busy" ? " is-busy" : liveStatus === "off" ? " is-off" : "");
    el.textContent = liveStatus === "off" ? "offline" : liveStatus === "busy" ? "updating" : "live";
  }
  async function markTurn() {
    if (S.mode !== "live") return;
    await fetch("/api/turn", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ label: "Marked step" }) });
    toast("Step marked");
  }
  function toast(text) {
    const t = h("div", { class: "fl-toast", role: "status", text });
    els.map.append(t);
    setTimeout(() => t.remove(), 1600);
  }

  // ---------- boot ----------
  mount();
  if (STATIC) {
    S = STATIC;
    // Open on the most interesting point: the latest step that changed structure, else the end.
    ui.snap = S.snapshots.length - 1;
    const hash = (location.hash || "").slice(1);
    const byHash = S.snapshots.findIndex((x) => x.ref.startsWith(hash) && hash.length >= 6);
    if (byHash >= 0) { ui.snap = byHash; ui.compare = "prev"; }
    openEntryFromUrl();
    if (S.snapshots.length > 2) {
      ui.compare = "prev";
      // Land on the most recent step that changed the architecture: that is the story.
      if (byHash < 0) for (let i = S.snapshots.length - 1; i > 0; i--) if (stepKind(S.snapshots[i])) { ui.snap = i; break; }
    }
    render();
  } else {
    loadLive().then(connect).catch((e) => { root.textContent = "Could not reach the faultline server: " + e.message; });
  }
})();

</script>
</body>
</html>
