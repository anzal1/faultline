name: faultline
description: Post the structural diff of every pull request as a comment, and fail the check when a fault line is crossed.
branding:
  icon: git-pull-request
  color: red
inputs:
  fail-on-fault:
    description: Fail the job when the pull request crosses a fault line declared in faultline.yml.
    default: "true"
  version:
    description: Version of faultline to run.
    default: latest
  comment:
    description: Post or update a sticky comment on the pull request.
    default: "true"
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Structural diff
      id: diff
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
        npx -y "@anzal1/faultline@${FL_VERSION}" diff "$BASE" "$HEAD_SHA" --format markdown -o "$RUNNER_TEMP/faultline.md"
        npx -y "@anzal1/faultline@${FL_VERSION}" diff "$BASE" "$HEAD_SHA" --format json -o "$RUNNER_TEMP/faultline.json"
        FAULTS=$(node -e "const d=require(process.argv[1]); console.log(d.delta.violations.introduced.length)" "$RUNNER_TEMP/faultline.json")
        echo "faults=$FAULTS" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/faultline.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Comment
      if: inputs.comment == 'true' && github.event.pull_request
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/faultline.md`, "utf8");
          const marker = "<!-- faultline:pr-comment -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.includes(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Fault check
      if: inputs.fail-on-fault == 'true' && steps.diff.outputs.faults != '0'
      shell: bash
      run: |
        echo "::error title=faultline::This pull request crosses ${{ steps.diff.outputs.faults }} fault line(s) declared in faultline.yml."
        exit 1
