name: faultline
description: Post the structural diff of every pull request as a comment, and fail the check when a fault line is crossed.
branding:
  icon: git-pull-request
  color: red
inputs:
  fail-on-fault:
    description: Fail the job when the pull request crosses a fault line declared in faultline.yml.
    default: "true"
  allow-loosening:
    description: Let the pull request loosen faultline.yml (remove or narrow a rule, move files between systems). Set it from an approval label, e.g. contains(github.event.pull_request.labels.*.name, 'faultline-approved').
    default: "false"
  comment:
    description: Post or update a sticky comment on the pull request.
    default: "true"
  working-directory:
    description: Directory that contains faultline.yml.
    default: "."
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up faultline
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        if [ ! -f dist/cli.js ]; then
          npm ci --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi
    - name: Structural diff
      id: diff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        FAULT="node $GITHUB_ACTION_PATH/dist/cli.js"
        BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
        $FAULT diff "$BASE" "$HEAD_SHA" --format markdown -o "$RUNNER_TEMP/faultline.md"
        $FAULT diff "$BASE" "$HEAD_SHA" --format json -o "$RUNNER_TEMP/faultline.json"
        FAULTS=$(node -e "const d=require(process.argv[1]); console.log(d.delta.violations.introduced.length)" "$RUNNER_TEMP/faultline.json")
        LOOSENED=$(node -e "const d=require(process.argv[1]); console.log((d.loosened||[]).length)" "$RUNNER_TEMP/faultline.json")
        echo "faults=$FAULTS" >> "$GITHUB_OUTPUT"
        echo "loosened=$LOOSENED" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/faultline.md" >> "$GITHUB_STEP_SUMMARY"
    - name: Comment
      if: inputs.comment == 'true' && github.event.pull_request
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/faultline.md`, "utf8");
          const marker = "<!-- faultline:pr-comment -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.includes(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Fault check
      if: inputs.fail-on-fault == 'true' && steps.diff.outputs.faults != '0'
      shell: bash
      run: |
        echo "::error title=faultline::This pull request crosses ${{ steps.diff.outputs.faults }} fault line(s) declared in faultline.yml."
        exit 1
    - name: Rules check
      if: inputs.fail-on-fault == 'true' && inputs.allow-loosening != 'true' && steps.diff.outputs.loosened != '0'
      shell: bash
      run: |
        echo "::error title=faultline::This pull request loosens faultline.yml in ${{ steps.diff.outputs.loosened }} way(s). A maintainer should approve it (for example with the label that sets allow-loosening)."
        exit 1
